[package]
name = "notebook-io"
version = "1.0.0"
description = "A quiet, lightweight notepad that saves everything locally."
authors = ["Notebook.io"]
edition = "2021"

[lib]
name = "notebook_io_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
